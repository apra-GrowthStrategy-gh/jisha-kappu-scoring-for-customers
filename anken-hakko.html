<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自社割賦 入力URLの発行（担当者用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --paper:#FFF; --ink:#16213A; --ink-2:#3C4659; --sub:#6B7484;
  --rule:#D7DCE4; --rule-soft:#EAEDF2; --focus:#2B4C8C;
  --ng:#C23A1E; --ng-bg:#FBEDEA; --ok:#1D7050; --ok-bg:#E7F3EC;
  --warn:#9A6212; --warn-bg:#FBF2E1; --r:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}
h1{font-size:20px;margin:0 0 2px}
.lead{font-size:13px;color:var(--sub);margin:0 0 16px}
button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--ink-2)}
.f{padding:7px 0}
.f>label,.f .lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.ib{display:flex;align-items:center;border:1px solid var(--rule);border-radius:6px;background:#FAFBFC;padding:0 12px}
.ib:focus-within{border-color:var(--focus);background:#fff}
.ib input{flex:1;min-width:0;width:100%;border:none;background:transparent;padding:11px 0;font-size:17px;color:var(--ink)}
.ib input:focus-visible{outline:none}
.ib.num input{text-align:right;font-size:19px}
.ib i{font-style:normal;font-size:13px;color:var(--sub);margin-left:8px}
.ib.bad{border-color:var(--ng);background:var(--ng-bg)}
.sel{width:100%;padding:11px;border:1px solid var(--rule);border-radius:6px;background:#FAFBFC;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plans{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plan{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--rule);background:#fff;color:var(--ink-2);cursor:pointer}
.plan[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:12px;color:var(--sub);margin:4px 0 0}

/* 担当者コンボ */
.combo{position:relative}
.combo .ib{padding-right:4px}
.caret{border:none;background:none;color:var(--sub);font-size:14px;padding:6px 8px;cursor:pointer}
.clist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:4px;list-style:none;
  background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(22,33,58,.12);max-height:260px;overflow:auto}
.clist li{padding:10px 12px;border-radius:4px;cursor:pointer;font-size:15px;line-height:1.4}
.clist li small{display:block;font-size:12px;color:var(--sub)}
.clist li[aria-selected="true"],.clist li:hover{background:#EEF2F9}
.clist li.none{color:var(--sub);cursor:default;font-size:13px}

.go{width:100%;padding:15px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.go:disabled{background:#AAB2C0;cursor:not-allowed}
.msg{font-size:13px;color:var(--ng);margin:10px 0 0;min-height:1.4em;text-align:center}

/* 発行結果 */
.issued{display:none;border:2px solid var(--ok);background:var(--ok-bg);border-radius:var(--r);padding:18px;margin-bottom:14px}
.issued.on{display:block}
.issued h2{font-size:16px;margin:0 0 4px;color:var(--ok)}
.issued .exp{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.urlbox{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button,.acts a{flex:1;min-width:120px;text-align:center;text-decoration:none;padding:11px;border-radius:6px;
  border:1px solid var(--ok);background:#fff;color:var(--ok);font-size:14px;font-weight:700;cursor:pointer}
.acts .main{background:var(--ok);color:#fff}
.tmpl{margin-top:12px}
.tmpl summary{font-size:13px;color:var(--ink-2);cursor:pointer}
.tmpl textarea{width:100%;margin-top:8px;border:1px solid var(--rule);border-radius:6px;padding:10px;font:inherit;font-size:13px;line-height:1.7;min-height:150px;background:#fff}
.again{margin-top:12px;width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink-2);font-size:13px;cursor:pointer}

/* テスト */
.tbar{position:fixed;left:0;right:0;top:0;z-index:50;background:repeating-linear-gradient(135deg,#B7791F,#B7791F 14px,#9A6212 14px,#9A6212 28px);
  color:#fff;font-size:13px;font-weight:700;text-align:center;padding:9px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
body.testing{padding-top:38px}
body.testing::after{content:"";position:fixed;inset:0;border:4px solid var(--warn);pointer-events:none;z-index:45}
.tpass{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.tpass .ib{flex:1;min-width:130px}
.tbtn{border:1px solid var(--rule);background:#FAFBFC;border-radius:6px;padding:9px 14px;font-size:13px;color:var(--ink-2);cursor:pointer}
h1{-webkit-user-select:none;user-select:none}
[hidden]{display:none !important}
.foot{font-size:12px;color:var(--sub);margin-top:16px;line-height:1.7}
.foot a{color:var(--focus)}
</style>
</head>
<body>
<div class="tbar" id="tbar" hidden>テストモード中 ― この案件は集計に入りません</div>

<div class="wrap">
  <h1>入力URLの発行</h1>
  <p class="lead">担当者用です。お客さまに送るURLをここで作ります。</p>

  <div class="tpass" id="tpass" hidden>
    <div class="ib"><input id="tpassInput" type="password" placeholder="パスコード" autocomplete="off"></div>
    <button type="button" class="tbtn" id="tpassGo">確定</button>
    <button type="button" class="tbtn" id="tpassCancel">閉じる</button>
  </div>

  <div class="issued" id="issued">
    <h2>URLを発行しました</h2>
    <p class="exp" id="exp">―</p>
    <div class="urlbox" id="urlbox">―</div>
    <div class="acts">
      <button type="button" class="main" id="copyUrl">URLをコピー</button>
      <button type="button" id="copyMsg">文面ごとコピー</button>
    </div>
    <details class="tmpl">
      <summary>送る文面を見る・直す</summary>
      <textarea id="tmplText" rows="8"></textarea>
    </details>
    <button type="button" class="again" id="again">続けてもう1件つくる</button>
  </div>

  <div id="form">
    <section class="card">
      <h2>担当者</h2>
      <div class="f">
        <label for="staffName">担当者名</label>
        <div class="combo" id="combo">
          <div class="ib"><input id="staffName" autocomplete="off" placeholder="名前を入力または選択"
            role="combobox" aria-expanded="false" aria-controls="staffList" aria-autocomplete="list">
            <button type="button" class="caret" id="caret" aria-label="一覧を開く">▾</button></div>
          <ul class="clist" id="staffList" role="listbox" hidden></ul>
        </div>
        <p class="hint" id="staffHint">読み込み中です…</p>
      </div>
      <div class="f">
        <label for="pass">パスコード</label>
        <div class="ib"><input id="pass" type="password" autocomplete="current-password"></div>
      </div>
    </section>

    <section class="card">
      <h2>ご案内中のプラン</h2>
      <div class="f">
        <label for="price">商品金額</label>
        <div class="ib num"><input id="price" inputmode="numeric" autocomplete="off"><i>円</i></div>
        <div class="plans" role="group" aria-label="プラン">
          <button type="button" class="plan" data-price="902000">MP / VP</button>
          <button type="button" class="plan" data-price="792000">MPA / VPA</button>
          <button type="button" class="plan" data-price="492800">MPC / VPC</button>
        </div>
      </div>
      <div class="two">
        <div class="f">
          <label for="down">頭金</label>
          <div class="ib num"><input id="down" inputmode="numeric" autocomplete="off"><i>円</i></div>
        </div>
        <div class="f">
          <label for="times">支払回数</label>
          <select class="sel" id="times"></select>
        </div>
      </div>
      <div class="f">
        <label for="memo">お客さま名（メモ）</label>
        <div class="ib"><input id="memo" autocomplete="off" placeholder="例）山田さま"></div>
        <p class="hint">台帳で案件を探しやすくするためのメモです。お客さまの画面には出ません</p>
      </div>
    </section>

    <button type="button" class="go" id="issue" disabled>URLを発行する</button>
    <p class="msg" id="msg"></p>
  </div>

  <p class="foot">発行したURLは<b>72時間で失効</b>し、<b>1回入力すると使えなくなります</b>。お客さまが入力を終えるとSlackに通知が届きます。結果は<a href="eigyo-kakunin.html">審査結果の確認</a>で見てください。</p>
</div>

<script>
(() => {
  // Apps Script のウェブアプリURLに差し替えてください
  const ENDPOINT = 'https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXX/exec';
  const TOKEN = 'apra-kappu-2026';
  const TEST_PASS = 'apra';
  const READY = !/XXXX/.test(ENDPOINT);

  const $ = id => document.getElementById(id);
  const half = s => String(s).replace(/[０-９．，]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const digits = s => half(s).replace(/\D/g, '');
  const parse = s => { const t = digits(s); return t === '' ? null : Number(t); };
  const yen = v => Math.round(v).toLocaleString('ja-JP');

  let TESTING = false, STAFF = null, lastUrl = '';

  function liveComma(el) {
    el.addEventListener('input', () => {
      const raw = half(el.value), caret = el.selectionStart ?? raw.length;
      const before = raw.slice(0, caret).replace(/\D/g, '').length;
      const all = raw.replace(/\D/g, ''), d = all.replace(/^0+(?=\d)/, '');
      const out = d ? Number(d).toLocaleString('ja-JP') : '';
      el.value = out;
      let pos = 0, seen = 0, target = Math.max(0, before - (all.length - d.length));
      while (pos < out.length && seen < target) { if (/\d/.test(out[pos])) seen++; pos++; }
      if (document.activeElement === el) el.setSelectionRange(pos, pos);
      check();
    });
  }

  const sel = $('times');
  for (let i = 3; i <= 60; i += 3) { const o = document.createElement('option'); o.value = i; o.textContent = `${i}回` + (i % 12 === 0 ? `（${i / 12}年）` : ''); sel.appendChild(o); }
  sel.value = '60';
  $('price').value = (902000).toLocaleString('ja-JP');
  $('down').value = '0';
  ['price', 'down'].forEach(id => liveComma($(id)));
  ['staffName', 'pass', 'memo'].forEach(id => $(id).addEventListener('input', check));
  document.querySelectorAll('.plan').forEach(b => b.addEventListener('click', () => {
    $('price').value = Number(b.dataset.price).toLocaleString('ja-JP');
    document.querySelectorAll('.plan').forEach(x => x.setAttribute('aria-pressed', x === b));
    check();
  }));

  // ── 担当者の一覧 ──
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1000);
      const sc = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 12000);
      function cleanup() { clearTimeout(timer); delete window[cb]; sc.remove(); }
      window[cb] = j => { cleanup(); resolve(j); };
      sc.onerror = () => { cleanup(); reject(new Error('error')); };
      sc.src = url + '&callback=' + cb;
      document.body.appendChild(sc);
    });
  }
  async function loadStaff() {
    if (!READY) { $('staffHint').textContent = '動作確認モードのため、名前は自由に入力できます'; return; }
    try {
      const j = await jsonp(ENDPOINT + '?mode=staff&token=' + encodeURIComponent(TOKEN));
      if (!j.ok) throw new Error(j.error);
      STAFF = j.staff || [];
      $('staffHint').textContent = `使用者リストの${STAFF.length}名から選べます`;
    } catch (e) {
      STAFF = null;
      $('staffHint').textContent = '一覧を読み込めませんでした。名前を直接入力してください';
    }
    check();
  }

  const combo = { open: false, idx: -1, items: [] };
  const staffInput = $('staffName'), staffList = $('staffList');
  const norm = t => String(t).toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .replace(/[\s　]/g, '');
  const matches = q => !STAFF ? [] : (!norm(q) ? STAFF : STAFF.filter(s => norm(s.name + s.kana + s.dept).includes(norm(q))));
  function renderList(items) {
    combo.items = items;
    staffList.innerHTML = items.length
      ? items.map((s, i) => `<li role="option" data-i="${i}" aria-selected="${i === combo.idx}">${s.name}${s.dept ? `<small>${s.dept}</small>` : ''}</li>`).join('')
      : '<li class="none">該当する担当者がいません</li>';
  }
  function openList(items) { if (!STAFF) return; renderList(items); staffList.hidden = false; combo.open = true; staffInput.setAttribute('aria-expanded', 'true'); }
  function closeList() { staffList.hidden = true; combo.open = false; combo.idx = -1; staffInput.setAttribute('aria-expanded', 'false'); }
  function pick(i) { const s = combo.items[i]; if (!s) return; staffInput.value = s.name; closeList(); check(); }
  staffInput.addEventListener('input', () => { combo.idx = -1; openList(matches(staffInput.value)); });
  staffInput.addEventListener('focus', () => openList(matches(staffInput.value)));
  $('caret').addEventListener('click', () => { if (combo.open) closeList(); else { staffInput.focus(); openList(matches('')); } });
  staffInput.addEventListener('keydown', e => {
    if (!combo.open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { openList(matches(staffInput.value)); return; }
    if (!combo.open) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); const n = combo.items.length; if (!n) return;
      combo.idx = e.key === 'ArrowDown' ? (combo.idx + 1) % n : (combo.idx - 1 + n) % n;
      renderList(combo.items); staffList.children[combo.idx]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (combo.idx >= 0) { e.preventDefault(); pick(combo.idx); }
      else if (combo.items.length === 1) { e.preventDefault(); pick(0); }
    } else if (e.key === 'Escape') closeList();
  });
  staffList.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(Number(li.dataset.i)); } });
  document.addEventListener('click', e => { if (!$('combo').contains(e.target)) closeList(); });
  loadStaff();

  // ── テストモード（タイトル3回タップ）──
  function applyTest() {
    document.body.classList.toggle('testing', TESTING);
    $('tbar').hidden = !TESTING;
  }
  let taps = 0, tapTimer = null;
  document.querySelector('h1').addEventListener('click', () => {
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 1200);
    if (taps < 3) return;
    taps = 0;
    if (TESTING) { TESTING = false; applyTest(); return; }
    $('tpass').hidden = false; $('tpassInput').focus();
  });
  $('tpassCancel').addEventListener('click', () => { $('tpass').hidden = true; $('tpassInput').value = ''; });
  $('tpassInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('tpassGo').click(); });
  $('tpassGo').addEventListener('click', () => {
    if ($('tpassInput').value.trim() === TEST_PASS) { TESTING = true; applyTest(); }
    $('tpass').hidden = true; $('tpassInput').value = '';
  });

  // ── 発行 ──
  function check() {
    const name = $('staffName').value.trim();
    const staffOk = STAFF ? STAFF.some(s => s.name === name) : name.length > 0;
    $('staffName').parentElement.classList.toggle('bad', !!name && !staffOk);
    const ok = staffOk && $('pass').value.length > 0 && (parse($('price').value) || 0) > 0;
    $('issue').disabled = !ok;
    return ok;
  }

  function template(url) {
    const p = parse($('price').value) || 0;
    return `お世話になっております。\n\nお支払いプランのご案内にあたり、下記より必要事項のご入力をお願いいたします。\n\n${url}\n\n・入力は5分ほどで終わります\n・このURLは72時間で使えなくなります\n・ご入力後、結果は担当よりご連絡いたします\n\nご不明な点がございましたら、お気軽にご連絡ください。`;
  }

  $('issue').addEventListener('click', async () => {
    if (!check()) return;
    const btn = $('issue');
    btn.disabled = true; btn.textContent = '発行しています…'; $('msg').textContent = '';
    try {
      let j;
      if (!READY) {
        await new Promise(r => setTimeout(r, 400));
        j = { ok: true, key: 'demo1234', url: location.href.replace(/[^/]*$/, '') + 'kokyaku-intake.html?k=demo1234', expires: '（動作確認モード）' };
      } else {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          body: JSON.stringify({
            token: TOKEN, action: 'create', pass: $('pass').value,
            staff_name: $('staffName').value.trim(),
            price: parse($('price').value) || 0, down: parse($('down').value) || 0,
            times: Number(sel.value), memo: $('memo').value.trim(), is_test: TESTING
          })
        });
        j = await res.json();
      }
      if (!j.ok) throw new Error(
        j.error === 'bad pass' ? 'パスコードが違います'
        : j.error === 'bad staff' ? '担当者名が使用者リストにありません'
        : '発行できませんでした');
      lastUrl = j.url;
      $('urlbox').textContent = j.url;
      $('exp').textContent = `有効期限：${j.expires} まで（1回入力すると使えなくなります）`;
      $('tmplText').value = template(j.url);
      $('issued').classList.add('on');
      $('form').hidden = true;
      window.scrollTo(0, 0);
    } catch (e) {
      $('msg').textContent = e.message || '発行できませんでした';
    } finally {
      btn.disabled = false; btn.textContent = 'URLを発行する'; check();
    }
  });

  async function copy(text, btn, label) {
    try {
      await navigator.clipboard.writeText(text);
      const before = btn.textContent;
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = before; }, 1800);
    } catch (e) { btn.textContent = '選択してコピーしてください'; }
  }
  $('copyUrl').addEventListener('click', e => copy(lastUrl, e.target));
  $('copyMsg').addEventListener('click', e => copy($('tmplText').value, e.target));
  $('again').addEventListener('click', () => {
    $('issued').classList.remove('on'); $('form').hidden = false;
    $('memo').value = ''; $('memo').focus(); check();
  });

  check();
})();
</script>
</body>
</html>
