<title>お手続きのご案内</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --fg:#1A1F28; --muted:#626C7A; --rule:#DCE1E8; --navy:#16213A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#182029; --fg:#E8ECF2; --muted:#98A3B2; --rule:#2A3340; --navy:#A9BEDD;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#182029; --fg:#E8ECF2; --muted:#98A3B2; --rule:#2A3340; --navy:#A9BEDD;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  line-height:1.8;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:40px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;
  max-width:460px;width:100%;padding:34px 28px;display:flex;flex-direction:column;gap:14px}
.mark{font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:700}
h1{font-size:21px;margin:0;line-height:1.5;color:var(--fg)}
p{margin:0;font-size:14.5px;color:var(--muted)}
.rule{height:1px;background:var(--rule);margin:6px 0 2px}
.note{font-size:13px;color:var(--muted)}
</style>

<div class="card">
  <span class="mark">APRA</span>
  <h1>お手続きのご案内</h1>
  <p>ご入力は、ご担当者からお送りするURLからお進みください。このページからはお手続きいただけません。</p>
  <div class="rule"></div>
  <p class="note">URLをお持ちでない場合、またはURLの期限が切れてしまった場合は、お手数ですがご担当者までご連絡ください。あらためてお送りします。</p>
</div>
